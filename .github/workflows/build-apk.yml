name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install PyInstaller
        # PyInstaller 5.13.2 is the last release whose bootloader runs on
        # Windows 7 (PyInstaller 6 dropped Windows 7 support).
        run: pip install "pyinstaller==5.13.2"

      - name: Build Windows exe
        # The spec bundles the Universal C Runtime DLLs (api-ms-win-crt-*,
        # ucrtbase.dll, vcruntime140.dll) so the exe runs on Windows 7
        # machines that never got KB2999226 / the VC++ Redistributable.
        run: pyinstaller windows/nova_windows.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-windows-exe
          path: dist/NOVA-Windows-7.exe
          if-no-files-found: error
          retention-days: 14
